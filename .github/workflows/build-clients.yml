name: Build Clients

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["client-v*"]
  pull_request:

env:
  FLUTTER_VERSION: "3.27.4"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android platform + deps
        run: |
          flutter create . --project-name agentdock_mobile --org com.agentdock --platforms=android
          if grep -q 'MyApp' test/widget_test.dart 2>/dev/null; then
            git checkout -- test/widget_test.dart 2>/dev/null || true
          fi
          flutter pub get

      - name: Patch Android SDK + permissions
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          for name in ("android.permission.INTERNET", "android.permission.RECORD_AUDIO"):
              if name not in text:
                  text = re.sub(
                      r"(<manifest\b[^>]*>)",
                      rf'\1\n    <uses-permission android:name="{name}"/>',
                      text,
                      count=1,
                  )
          # LAN pet assets are served over plain HTTP (:8766)
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          manifest.write_text(text, encoding="utf-8")

          replacements = [
              (r"(?m)^(\s*minSdk\s*=\s*).+$", r"\g<1>24"),
              (r"(?m)^(\s*minSdkVersion\s+).+$", r"\g<1>24"),
              (r"(?m)^(\s*compileSdk\s*=\s*).+$", r"\g<1>35"),
              (r"(?m)^(\s*compileSdkVersion\s+).+$", r"\g<1>35"),
              (r"(?m)^(\s*targetSdk\s*=\s*).+$", r"\g<1>35"),
              (r"(?m)^(\s*targetSdkVersion\s+).+$", r"\g<1>35"),
          ]
          for gradle in (
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ):
              if not gradle.exists():
                  continue
              g = gradle.read_text(encoding="utf-8")
              for pat, repl in replacements:
                  g, _ = re.subn(pat, repl, g)
              gradle.write_text(g, encoding="utf-8")
          print("android patch ok")
          PY

      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v6
        with:
          name: agentdock-android
          path: clients/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: clients/mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Windows platform + deps
        shell: bash
        run: |
          flutter create . --project-name agentdock_mobile --org com.agentdock --platforms=windows
          if grep -q 'MyApp' test/widget_test.dart 2>/dev/null; then
            git checkout -- test/widget_test.dart 2>/dev/null || true
          fi
          flutter pub get

      - run: flutter build windows --release

      - name: Zip Windows release
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/agentdock-windows.zip" .

      - uses: actions/upload-artifact@v6
        with:
          name: agentdock-windows
          path: agentdock-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: agentdock-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate macOS platform + deps
        run: |
          flutter create . --project-name agentdock_mobile --org com.agentdock --platforms=macos
          if grep -q 'MyApp' test/widget_test.dart 2>/dev/null; then
            git checkout -- test/widget_test.dart 2>/dev/null || true
          fi
          flutter pub get

      - name: Patch macOS mic / network entitlements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          info = Path("macos/Runner/Info.plist")
          if info.exists():
              text = info.read_text(encoding="utf-8")
              if "NSMicrophoneUsageDescription" not in text:
                  text = text.replace(
                      "</dict>",
                      "\t<key>NSMicrophoneUsageDescription</key>\n"
                      "\t<string>AgentDock needs the microphone for voice turns.</string>\n"
                      "</dict>",
                      1,
                  )
                  info.write_text(text, encoding="utf-8")

          for ent in (
              Path("macos/Runner/DebugProfile.entitlements"),
              Path("macos/Runner/Release.entitlements"),
          ):
              if not ent.exists():
                  continue
              t = ent.read_text(encoding="utf-8")
              if "com.apple.security.device.audio-input" not in t:
                  t = t.replace(
                      "</dict>",
                      "\t<key>com.apple.security.device.audio-input</key>\n"
                      "\t<true/>\n"
                      "\t<key>com.apple.security.network.client</key>\n"
                      "\t<true/>\n"
                      "</dict>",
                      1,
                  )
                  ent.write_text(t, encoding="utf-8")
          print("macos patch ok")
          PY

      - run: flutter build macos --release

      - name: Zip macOS app
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/agentdock-macos.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: agentdock-macos
          path: agentdock-macos.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: agentdock-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS IPA (unsigned / TrollStore)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate iOS platform + deps
        run: |
          flutter create . --project-name agentdock_mobile --org com.agentdock --platforms=ios
          if grep -q 'MyApp' test/widget_test.dart 2>/dev/null; then
            git checkout -- test/widget_test.dart 2>/dev/null || true
          fi
          flutter pub get

      - name: Patch iOS microphone usage
        run: |
          python3 <<'PY'
          from pathlib import Path

          info = Path("ios/Runner/Info.plist")
          text = info.read_text(encoding="utf-8")
          if "NSMicrophoneUsageDescription" not in text:
              text = text.replace(
                  "</dict>",
                  "\t<key>NSMicrophoneUsageDescription</key>\n"
                  "\t<string>AgentDock needs the microphone for voice turns.</string>\n"
                  "</dict>",
                  1,
              )
              info.write_text(text, encoding="utf-8")
          print("ios patch ok")
          PY

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA for TrollStore / sideload
        run: |
          set -euo pipefail
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (
            cd "$STAGE"
            zip -r "$GITHUB_WORKSPACE/agentdock-ios-unsigned.ipa" Payload
          )
          ls -lh "$GITHUB_WORKSPACE/agentdock-ios-unsigned.ipa"

      - uses: actions/upload-artifact@v6
        with:
          name: agentdock-ios-unsigned
          path: agentdock-ios-unsigned.ipa

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: agentdock-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
