name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["client-v*"]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android platform + deps
        run: |
          flutter create . --project-name agentdock_mobile --org com.agentdock --platforms=android
          flutter pub get

      - name: Ensure mic + internet permissions + minSdk
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          for name in ("android.permission.INTERNET", "android.permission.RECORD_AUDIO"):
              if name not in text:
                  text = re.sub(
                      r"(<manifest\b[^>]*>)",
                      rf'\1\n    <uses-permission android:name="{name}"/>',
                      text,
                      count=1,
                  )
          manifest.write_text(text, encoding="utf-8")

          # record / permission_handler need a modern minSdk
          # Replace only the minSdk *line* (do not touch targetSdk).
          for gradle in (
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ):
              if not gradle.exists():
                  continue
              g = gradle.read_text(encoding="utf-8")
              g2, n1 = re.subn(
                  r"(?m)^(\s*minSdk\s*=\s*).+$",
                  r"\g<1>24",
                  g,
              )
              g2, n2 = re.subn(
                  r"(?m)^(\s*minSdkVersion\s+).+$",
                  r"\g<1>24",
                  g2,
              )
              gradle.write_text(g2, encoding="utf-8")
              print(f"{gradle}: minSdk lines replaced={n1 + n2}")
              for line in g2.splitlines():
                  if "minSdk" in line or "targetSdk" in line:
                      print(" ", line.strip())
          print("permissions ok")
          PY

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: agentdock-android
          path: clients/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: clients/mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
