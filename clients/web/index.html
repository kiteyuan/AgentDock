<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AgentDock</title>
  <link rel="stylesheet" href="./styles.css?v=6" />
</head>
<body>
  <div class="stage" id="stage" data-mood="offline">
    <div class="stack">
      <button type="button" id="bot" class="bot" aria-label="通话，长按打开设置">
        <div class="sprite-wrap">
          <canvas id="sprite" class="sprite" width="192" height="208" aria-hidden="true"></canvas>
        </div>
      </button>

      <div class="reply-box" id="replyBox" aria-live="polite">
        <p id="reply" class="reply"></p>
        <span id="caret" class="caret"></span>
      </div>
    </div>
  </div>

  <dialog id="settings">
    <form method="dialog" class="sheet">
      <h2>连接</h2>
      <label>Runtime WS</label>
      <input id="url" type="text" placeholder="ws://192.168.x.x:8765" />
      <label>Token（可选）</label>
      <input id="token" type="password" placeholder="token" />
      <label>TTS</label>
      <select id="ttsId">
        <option value="haibara">haibara</option>
      </select>
      <label>角色</label>
      <select id="petId"></select>
      <div class="sheet-actions">
        <button type="submit" id="btnSave" value="save">保存并连接</button>
        <button type="button" id="btnClose" value="cancel">关闭</button>
      </div>
    </form>
  </dialog>

  <script src="./pixel-bot.js?v=3"></script>
  <script src="./app.js?v=9"></script>
</body>
</html>
