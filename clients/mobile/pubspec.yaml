name: agentdock_mobile
description: AgentDock thin mobile client (Device Protocol over WebSocket).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  record: 6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/monthly-salary-cat/spritesheet.webp
    - assets/sprites/arona-v1/spritesheet.webp
